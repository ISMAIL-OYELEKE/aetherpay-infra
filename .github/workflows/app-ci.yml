# Application pipeline: lint + test on every PR; on main, build once, scan,
# push an immutable image to ECR with keyless OIDC, sign it, and print the
# digest to promote (environments deploy by digest only).

name: app-ci

on:
  pull_request:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  workflow_dispatch: # build the first image right after bootstrap

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Publish only outside PRs and once bootstrap has set the repo variables.
      PUBLISH: ${{ github.event_name != 'pull_request' && vars.AWS_IMAGE_PUSH_ROLE_ARN != '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: aetherpay-app:ci
          provenance: false

      - name: vulnerability scan (blocks on fixable critical/high)
        uses: anchore/scan-action@v6
        with:
          image: aetherpay-app:ci
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table # findings are printed in the job log

      - name: note when publishing is not configured yet
        if: github.event_name != 'pull_request' && env.PUBLISH != 'true'
        run: echo "::notice::Image built and scanned but not pushed. Run terraform/bootstrap and scripts/configure-github.sh to set AWS_IMAGE_PUSH_ROLE_ARN, AWS_REGION and ECR_REPOSITORY_URL."

      - name: configure AWS credentials (OIDC, image push role)
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          role-session-name: image-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: login to ECR
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # Push with BuildKit itself, not `docker tag` + `docker push`. On the
      # runner's Docker 29 (containerd image store) a re-push rewrote the
      # manifest so its layer list no longer matched the config's rootfs, and
      # Fargate refused to unpack it ("mismatched image rootfs and manifest
      # layers"). The builder reuses the cache from the build step above, so
      # this pushes the same layers that were scanned.
      - name: push immutable tag
        id: build_push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:git-${{ github.sha }}
          provenance: false
          sbom: false

      - name: image reference
        id: push
        if: env.PUBLISH == 'true'
        env:
          REPO: ${{ vars.ECR_REPOSITORY_URL }}
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: echo "image=$REPO@$DIGEST" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
        if: env.PUBLISH == 'true'

      - name: sign image (keyless)
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${{ steps.push.outputs.image }}"

      - name: promotion instructions
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "${{ steps.push.outputs.image }}"
            echo '```'
            echo "Promote by opening a PR that sets \`app_image\` in"
            echo "\`terraform/environments/staging/image.auto.tfvars\` to the value above."
          } >> "$GITHUB_STEP_SUMMARY"
